<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ai-env-setup: one command, identical AI tooling on every Mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(70 64) scale(0.75)">
    <rect width="256" height="256" rx="56" fill="#0b1020" stroke="#312e81" stroke-width="3"/>
    <g fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 62 112 A 70 70 0 0 1 184 78"/>
      <path d="M 194 144 A 70 70 0 0 1 72 178"/>
    </g>
    <g fill="url(#ring)">
      <path d="M 196 48 L 200 98 L 152 86 Z" transform="rotate(8 190 80)"/>
      <path d="M 60 208 L 56 158 L 104 170 Z" transform="rotate(8 66 176)"/>
    </g>
    <g fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 106 108 L 134 128 L 106 148"/>
      <path d="M 146 150 H 168"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="300" y="150" font-size="64" font-weight="700" fill="#f8fafc">ai-env-setup</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="302" y="196" font-size="26" fill="#c7d2fe">One command. Identical AI tooling on every Mac.</text>
  </g>

  <!-- tool chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e0e7ff">
    <rect x="302" y="226" width="150" height="38" rx="19" fill="#312e81" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.6"/>
    <text x="377" y="251" text-anchor="middle">Claude Code</text>
    <rect x="466" y="226" width="96" height="38" rx="19" fill="#312e81" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.6"/>
    <text x="514" y="251" text-anchor="middle">Codex</text>
    <rect x="576" y="226" width="102" height="38" rx="19" fill="#312e81" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.6"/>
    <text x="627" y="251" text-anchor="middle">Cursor</text>
  </g>
</svg>
