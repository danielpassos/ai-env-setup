<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ai-env-setup logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- sync ring: two arcs with arrowheads -->
  <g fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 62 112 A 70 70 0 0 1 184 78"/>
    <path d="M 194 144 A 70 70 0 0 1 72 178"/>
  </g>
  <g fill="url(#ring)">
    <path d="M 196 48 L 200 98 L 152 86 Z" transform="rotate(8 190 80)"/>
    <path d="M 60 208 L 56 158 L 104 170 Z" transform="rotate(8 66 176)"/>
  </g>
  <!-- prompt -->
  <g fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 106 108 L 134 128 L 106 148"/>
    <path d="M 146 150 H 168"/>
  </g>
</svg>
