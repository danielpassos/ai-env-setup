# Claude Code plugins - packages only ever published as a Claude Code
# plugin marketplace, with no generic `skills add` equivalent (see
# manifest/skills.yaml). Unlike that file, this one is inherently
# Claude-Code-only: plugin marketplaces are a Claude Code concept, so every
# entry here only ever installs for the `claude` tool - there's no
# `only`/`agents` field to widen scope, and there never will be.
#
# packages[].marketplace_source: owner/repo (or full URL) passed to
#   `claude plugin marketplace add <source>` - same as the interactive
#   `/plugin marketplace add`.
# packages[].marketplace: the marketplace's own name/id, from its
#   `.claude-plugin/marketplace.json` (`name`/`id` field) - read from that
#   file rather than guessed, since it doesn't have to match the repo name.
# packages[].plugin: the plugin name to install, from the marketplace's
#   `plugins[].name` - passed as `claude plugin install <plugin>@<marketplace>`.

packages:
  # Behavioral guidelines distilled from Andrej Karpathy's observations on
  # common LLM coding mistakes (think before coding, simplicity first,
  # surgical changes, goal-driven execution).
  - marketplace_source: "multica-ai/andrej-karpathy-skills"
    marketplace: "karpathy-skills"
    plugin: "andrej-karpathy-skills"

  # Anthropic's own plugin: analyzes a codebase and recommends tailored
  # Claude Code automations (hooks, skills, MCP servers, subagents, slash
  # commands). Read-only - suggests, doesn't modify anything.
  # https://claude.com/plugins/claude-code-setup
  - marketplace_source: "anthropics/claude-plugins-official"
    marketplace: "claude-plugins-official"
    plugin: "claude-code-setup"

  # Browser automation and end-to-end testing MCP server by Microsoft -
  # lets Claude interact with web pages, take screenshots, fill forms,
  # click elements, and run automated browser testing workflows.
  # https://claude.com/plugins/playwright
  - marketplace_source: "anthropics/claude-plugins-official"
    marketplace: "claude-plugins-official"
    plugin: "playwright"

  # Persistent memory across sessions: captures what happened during a
  # session, compresses it, and injects relevant context back into future
  # ones. The repo itself is the marketplace (only its `plugin` subdir); it
  # also offers "claude-mem-cowork" (cloud-session variant), not installed
  # here.
  # https://github.com/thedotmack/claude-mem
  - marketplace_source: "thedotmack/claude-mem"
    marketplace: "thedotmack"
    plugin: "claude-mem"

  # Generates standalone HTML pages for diagrams, diff reviews, plan
  # reviews, slides, and data tables - a lighter-weight visual output path
  # than the artifact-publishing flow this repo doesn't otherwise touch.
  # https://github.com/nicobailon/visual-explainer
  - marketplace_source: "nicobailon/visual-explainer"
    marketplace: "visual-explainer-marketplace"
    plugin: "visual-explainer"
