# Plugins - packages only ever published as a plugin marketplace, with no
# generic `skills add` equivalent (see manifest/skills.yaml). Installed via
# each agent's own plugin CLI (`claude plugin ...` / `codex plugin ...`),
# not the `skills` CLI, so scope is set by the optional `agents` field below
# rather than manifest/skills.yaml's `only`/`agents`.
#
# packages[].agents: optional - which agents to install for, a list of
#   `claude` and/or `codex`. Defaults to ["claude"] when omitted. An agent
#   is only synced when it is also among the tools selected that run and
#   its CLI is installed. Codex needs the repo to also ship a
#   `.codex-plugin/` manifest (or be catalog-compatible).
# packages[].marketplace_source: owner/repo (or full URL) passed to
#   `claude plugin marketplace add <source>` (and `codex plugin marketplace
#   add <source>` for codex) - same as the interactive `/plugin marketplace
#   add`.
# packages[].marketplace: the marketplace's own name/id, from its
#   `.claude-plugin/marketplace.json` (`name`/`id` field) - read from that
#   file rather than guessed, since it doesn't have to match the repo name.
# packages[].plugin: the plugin name to install, from the marketplace's
#   `plugins[].name` - passed as `claude plugin install <plugin>@<marketplace>`
#   (or `codex plugin add <plugin>@<marketplace>`).
# packages[].name: optional - short friendly label shown in the picker.
#   Falls back to the bare `plugin` name when omitted (already fairly
#   readable for most of these, unlike manifest/skills.yaml's raw
#   "owner/repo" sources).
# packages[].description: optional - one-line description shown next to
#   `name` in the picker.

packages:
  # Behavioral guidelines distilled from Andrej Karpathy's observations on
  # common LLM coding mistakes (think before coding, simplicity first,
  # surgical changes, goal-driven execution).
  - marketplace_source: "multica-ai/andrej-karpathy-skills"
    marketplace: "karpathy-skills"
    plugin: "andrej-karpathy-skills"
    name: "Karpathy Guidelines"
    description: "Behavioral guidelines from Andrej Karpathy's LLM coding observations"

  # Anthropic's own plugin: analyzes a codebase and recommends tailored
  # Claude Code automations (hooks, skills, MCP servers, subagents, slash
  # commands). Read-only - suggests, doesn't modify anything.
  # https://claude.com/plugins/claude-code-setup
  - marketplace_source: "anthropics/claude-plugins-official"
    marketplace: "claude-plugins-official"
    plugin: "claude-code-setup"
    name: "Automation Recommender"
    description: "Analyzes your codebase and suggests Claude Code automations (read-only)"

  # Browser automation and end-to-end testing MCP server by Microsoft -
  # lets Claude interact with web pages, take screenshots, fill forms,
  # click elements, and run automated browser testing workflows.
  # https://claude.com/plugins/playwright
  - marketplace_source: "anthropics/claude-plugins-official"
    marketplace: "claude-plugins-official"
    plugin: "playwright"
    description: "Browser automation and E2E testing MCP server by Microsoft"

  # Persistent memory across sessions: captures what happened during a
  # session, compresses it, and injects relevant context back into future
  # ones. The repo itself is the marketplace (only its `plugin` subdir); it
  # also offers "claude-mem-cowork" (cloud-session variant), not installed
  # here.
  # https://github.com/thedotmack/claude-mem
  - marketplace_source: "thedotmack/claude-mem"
    marketplace: "thedotmack"
    plugin: "claude-mem"
    description: "Persistent memory/context compression across sessions"

  # Generates standalone HTML pages for diagrams, diff reviews, plan
  # reviews, slides, and data tables - a lighter-weight visual output path
  # than the artifact-publishing flow this repo doesn't otherwise touch.
  # https://github.com/nicobailon/visual-explainer
  - marketplace_source: "nicobailon/visual-explainer"
    marketplace: "visual-explainer-marketplace"
    plugin: "visual-explainer"
    description: "Generates HTML pages for diagrams, diff/plan reviews, and slides"

  # Lets Claude "watch" a video via /watch: yt-dlp download, scene-change
  # frame extraction (ffmpeg), 0-10s hook breakdown, captions or Whisper
  # transcript, structured report. yt-dlp/ffmpeg install on first run via
  # brew; Whisper API key only needed for videos without captions.
  # https://github.com/taoufik123-collab/claude-watch
  - marketplace_source: "taoufik123-collab/claude-watch"
    marketplace: "claude-watch"
    plugin: "watch"
    name: "Watch"
    description: "Lets Claude watch videos: scene-change frames + transcript + report"

  # Turns a project into a short launch video via /brag (also /brag-slim),
  # powered by Hyperframes. Requires Node 22+ and ffmpeg on the machine
  # (Hyperframes is fetched via npx). Ships both Claude Code and Codex
  # manifests, so it installs for both.
  # https://github.com/latent-spaces/brag
  - agents: ["claude", "codex"]
    marketplace_source: "latent-spaces/brag"
    marketplace: "brag"
    plugin: "brag"
    name: "Brag"
    description: "Turns a project into a short launch video via /brag (needs Node 22+, ffmpeg)"
