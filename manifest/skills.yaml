# External skill packages installed via the `skills` CLI (npx skills add).
# https://skills.sh
#
# Distinct from the root skills/ dir: that's skills you author yourself and
# link in via manifest/tools.yaml. This is for pulling in someone else's
# published skill package wholesale.
#
# packages[].source: a GitHub owner/repo (or full URL), same as `skills add <package>`
# packages[].skills: optional - only install these skill names from the
#   package (omit to install everything it offers)
# packages[].only: optional - only install for these tool ids, using this
#   repo's own ids from manifest/tools.yaml (e.g. "claude", "codex", "cursor"),
#   regardless of which tools were selected in this run. Each id is
#   translated to that tool's skills_agent before being passed to the CLI.
#   Omit this (the normal case) and the package installs for whichever tools
#   you selected in this run instead - never for every agent the `skills`
#   CLI happens to know about.
# packages[].agents: optional - same idea as `only`, but takes the `skills`
#   CLI's own agent ids directly (they don't always match this repo's tool
#   ids - notably "claude-code", not "claude"). Only useful for agents this
#   repo doesn't otherwise manage. If both are set, `only` wins.

packages:
  # Only "find-skills" - teaches the agent to search/install other skills
  # via the `npx skills` CLI when asked "is there a skill for X". Note this
  # is a different repo from vercel-labs/agent-skills (which has no
  # find-skills of its own).
  - source: "vercel-labs/skills"
    skills: ["find-skills"]

  # Only "wayfinder" - breaks work too large for one agent session into a
  # shared map of decision tickets on the issue tracker, resolved one at a
  # time. The rest of this repo's 36 skills weren't picked.
  - source: "mattpocock/skills"
    skills: ["wayfinder"]

  # Rewrites AI-sounding prose (stock phrasing, filler, passive voice, etc.)
  # to read naturally without changing what it says.
  - source: "blader/humanizer"

  # Material Design 3 (Material You): components, design tokens, theming,
  # responsive layout, and MD3 compliance audits. Primarily Jetpack Compose
  # Material3, also Flutter and (maintenance-mode) web.
  - source: "hamen/material-3-skill"

  # Chris Banes (Jetpack Compose/Accompanist, Google): Compose (state/effects,
  # performance, component design, animations, testing) and Kotlin
  # (coroutines/flow, control flow, API design) plus Gradle workflows.
  - source: "chrisbanes/skills"

  # skydoves: 25 skills focused specifically on Jetpack Compose performance -
  # recomposition, stability inference, LazyColumn/prefetch tuning,
  # Modifier.Node migration, baseline profiles, R8/release-mode measurement,
  # and Compose HotSwan. Complements chrisbanes/skills rather than
  # duplicating it. README documents a manual git-clone install, but the
  # repo is plain SKILL.md files and `skills add` discovers all 25 fine.
  - source: "skydoves/compose-performance-skills"

  # wondelai: book-distillation skills, mostly product/business/marketing
  # (storybrand-messaging, negotiation, traction-eos...) out of scope here.
  # Picked only the software-engineering-general ones plus the original
  # usability pick, out of this repo's 62 skills:
  #   - ux-heuristics: Nielsen's 10 heuristics + Krug's "Don't Make Me
  #     Think" - severity-rated interface reviews
  #   - clean-code / clean-architecture / refactoring-patterns: Robert
  #     Martin's code-quality and architecture principles
  #   - domain-driven-design: Evans' DDD - bounded contexts, aggregates,
  #     ubiquitous language
  #   - ddia-systems: Kleppmann's "Designing Data-Intensive Applications" -
  #     distributed systems tradeoffs
  #   - system-design: general system-design interview/practice patterns
  #   - team-topologies: Skelton & Pais - team structure and interaction
  #     modes for fast flow
  #   - working-with-legacy-code: Feathers' techniques for safely changing
  #     code without tests
  #   - pragmatic-programmer: Hunt & Thomas's general craftsmanship
  #     practices
  - source: "wondelai/skills"
    skills:
      - ux-heuristics
      - clean-code
      - clean-architecture
      - refactoring-patterns
      - domain-driven-design
      - ddia-systems
      - system-design
      - team-topologies
      - working-with-legacy-code
      - pragmatic-programmer

  # JuliusBrussee/caveman: 20 skills - ultra-compressed "caveman" output mode
  # (~65% fewer tokens) plus workflow skills (investigate-first, lean-build,
  # migration, safe-refactor, surgical-patch, verify-and-stop) and subagent
  # delegation (cavecrew). A few skills (caveman-setup/-manage/-optimize/
  # -evidence-review) are optional integrations with the paid Caveman Cloud
  # gateway - inert unless set up separately, everything else is standalone.
  # This `skills add` install is the repo's own documented lightweight path
  # (vs. its separate `@caveman-ai/cli` full installer with hooks/statusline).
  - source: "JuliusBrussee/caveman"
