# External skill packages. See README.md for the shared schema.

packages:
  # Teaches agents to find and install additional skills through the skills
  # CLI when asked whether a skill exists for a task. Enables discovery beyond
  # the packages selected in this manifest.
  - source: "vercel-labs/skills"
    name: "Find Skills"
    description: "Search and install other skills via the `skills` CLI"
    skills: ["find-skills"]
