# External skill packages. See README.md for the shared schema.

packages:
  # Book-based software engineering guidance for code quality, architecture,
  # domain modeling, distributed systems, team organization, and safe changes
  # to legacy code. The selection focuses on engineering practice; the
  # package's business and marketing material is excluded.
  - source: "wondelai/skills"
    name: "Software Design"
    description: "Clean code/architecture, DDD, system design, usability heuristics"
    skills:
      - clean-code
      - clean-architecture
      - refactoring-patterns
      - domain-driven-design
      - ddia-systems
      - system-design
      - team-topologies
      - working-with-legacy-code
      - pragmatic-programmer

  # Multi-phase security audit of a codebase: reconnaissance, coverage-led
  # hunting, adversarial validation, and verified machine-readable findings
  # (findings.json) plus a derived report. Complements the engineering
  # guidance above with vulnerability discovery rather than design advice,
  # and overlaps with Android Intent/Permissions Security only for Android
  # targets. Installs the single security-audit skill via the skills CLI for
  # whichever agents are selected. Requires Node.js for its zero-dependency
  # validators and an agent that supports parallel sub-agents; running
  # target code needs an OS-enforced sandbox, otherwise leads stay
  # needs_validation.
  - source: "cloudflare/security-audit-skill"
    name: "Security Audit"
    description: "Multi-phase security audits with independently verified findings"
    skills: ["security-audit"]
