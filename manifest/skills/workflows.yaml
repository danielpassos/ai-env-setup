# External skill packages. See README.md for the shared schema.

packages:
  # Issue triage and architecture review with supporting guidance for
  # questioning assumptions, domain modeling, and module boundaries.
  # Supporting skills are required by these workflows and can also activate
  # independently. Project-specific issue-tracker setup remains a separate
  # step; triage can fall back to a local Markdown tracker.
  - source: "mattpocock/skills"
    name: "Triage + Architecture Review"
    description: "Issue triage and architecture-deepening review (grilling as backing dependency)"
    skills:
      - grilling
      - domain-modeling
      - codebase-design
      - triage
      - improve-codebase-architecture

  # Structured workflows for moving from an idea through planning, execution,
  # review, and verification. Includes test-first development and branch
  # lifecycle guidance for both inline and delegated work.
  # The always-on using-superpowers entry is excluded because it requires
  # skill invocation before every response, including clarifying questions.
  - source: "obra/superpowers"
    name: "Superpowers (debugging/review/planning)"
    description: "Systematic debugging, code review, and idea-to-plan pipeline"
    skills:
      - systematic-debugging
      - requesting-code-review
      - receiving-code-review
      - brainstorming
      - writing-plans
      - executing-plans
      - subagent-driven-development
      - test-driven-development
      - dispatching-parallel-agents
      - using-git-worktrees
      - finishing-a-development-branch
      - verification-before-completion
      - writing-skills

  # Compressed response styles alongside workflows for investigation, scoped
  # changes, refactoring, verification, and delegation. Optional Caveman Cloud
  # integrations require separate setup with the paid service. This manifest
  # uses the skills CLI installation path; the full Caveman CLI installer
  # and its hooks are not installed here.
  - source: "JuliusBrussee/caveman"
    name: "Caveman"
    description: "Ultra-compressed output mode plus workflow/subagent-delegation skills"
