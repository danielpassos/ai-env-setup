# External skill packages: writing. See README.md for the shared schema.

packages:
  # Rewrites AI-sounding prose (stock phrasing, filler, passive voice, etc.)
  # to read naturally without changing what it says.
  - source: "blader/humanizer"
    name: "Humanizer"
    description: "Rewrite AI-sounding prose to read naturally"

  # Reshapes replies to lead with the answer/next action, numbered steps,
  # capped lists, no preamble/recaps - opt-in per session via /i-have-adhd
  # (disable-model-invocation: true, so it never auto-fires). Repo also
  # ships a Claude-Code-only plugin with an always-on SessionStart hook -
  # not picked here, same reasoning as obra/superpowers above: the plain
  # `skills add` route works for every tool this manifest manages, the
  # plugin route only for Claude Code.
  - source: "ayghri/i-have-adhd"
    name: "I Have ADHD"
    description: "ADHD-friendly output style - answer-first, numbered, no preamble"
