# External skill packages. See README.md for the shared schema.

packages:
  # Rewrites AI-sounding prose while preserving its meaning. Addresses stock
  # phrasing, filler, inflated claims, and repetitive sentence patterns.
  - source: "blader/humanizer"
    name: "Humanizer"
    description: "Rewrite AI-sounding prose to read naturally"

  # Formats replies around the answer or next action, with numbered steps,
  # capped lists, and less preamble. Opt-in per session via /i-have-adhd;
  # the skill disables automatic model invocation. The separate plugin with
  # an always-on session hook is not installed through this manifest.
  - source: "ayghri/i-have-adhd"
    name: "I Have ADHD"
    description: "ADHD-friendly output style - answer-first, numbered, no preamble"
